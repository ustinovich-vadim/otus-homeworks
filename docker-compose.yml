version: '3.8'

services:
    app:
        build:
            context: ./docker
            dockerfile: Dockerfile
        container_name: app
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - app_network
        depends_on:
            - redis
            - master
        environment:
            - QUEUE_CONNECTION=redis
        command: >
            sh -c "
            mkdir -p /var/www/storage /var/www/bootstrap/cache &&
            chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache &&
            php-fpm
            "
        restart: unless-stopped

    webserver:
        image: nginx:alpine
        container_name: webserver
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
        depends_on:
            - app
        networks:
            - app_network
        restart: unless-stopped

    redis:
        image: redis:alpine
        container_name: redis
        ports:
            - "6380:6379"
        networks:
            - app_network
        restart: unless-stopped

    queue-worker:
        build:
            context: ./docker
            dockerfile: Dockerfile
        container_name: queue-worker
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - app_network
        depends_on:
            - redis
            - master
        environment:
            - QUEUE_CONNECTION=redis
        command: >
            sh -c "
            php artisan queue:work --tries=3 --timeout=90
            "
        restart: unless-stopped

    # Citus Master Node
    master:
        container_name: citus_master
        image: "citusdata/citus:12.1.3"
        ports:
            - "5433:5432"
        labels:
            - "com.citusdata.role=Master"
        environment: &AUTH
            POSTGRES_USER: "postgres"
            POSTGRES_PASSWORD: "secret"
            PGUSER: "postgres"
            PGPASSWORD: "secret"
            POSTGRES_HOST_AUTH_METHOD: "trust"
        networks:
            - app_network
        volumes:
            - masterdata:/var/lib/postgresql/data
        restart: unless-stopped

    # Citus Worker Node
    citus-worker:
        image: "citusdata/citus:12.1.3"
        labels:
            - "com.citusdata.role=Worker"
        depends_on:
            - manager
        environment: *AUTH
        command: "/wait-for-manager.sh"
        volumes:
            - healthcheck-volume:/healthcheck
        networks:
            - app_network
        restart: unless-stopped

    # Citus Manager Node
    manager:
        container_name: citus_manager
        image: "citusdata/membership-manager:0.3.0"
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock"
            - healthcheck-volume:/healthcheck
        depends_on:
            - master
        environment: *AUTH
        networks:
            - app_network
        restart: unless-stopped

networks:
    app_network:
        driver: bridge

volumes:
    masterdata:
        driver: local
    healthcheck-volume:
        driver: local
