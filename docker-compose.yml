version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
        container_name: app
        dns:
            - 8.8.8.8
            - 8.8.4.4
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - app_network
        depends_on:
            - redis
            - db
            - rabbitmq
            - friend_feed_worker
            - notification_worker
        environment:
            - QUEUE_CONNECTION=redis
        command: >
            sh -c "
            mkdir -p /var/www/storage /var/www/bootstrap/cache &&
            chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache &&
            php-fpm
            "
        restart: unless-stopped

    webserver:
        image: nginx:alpine
        container_name: webserver
        dns:
            - 8.8.8.8
            - 8.8.4.4
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
        depends_on:
            - app
        networks:
            - app_network
        restart: unless-stopped

    db:
        image: postgres:16
        container_name: db
        dns:
            - 8.8.8.8
            - 8.8.4.4
        environment:
            POSTGRES_DB: postgres
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: secret
        volumes:
            - dbdata:/var/lib/postgresql/data
            - ./docker/postgres-config/postgresql.conf:/etc/postgresql/postgresql.conf
            - ./docker/postgres-config/pg_hba.conf:/etc/postgresql/pg_hba.conf
        command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf" ]
        ports:
            - "5433:5432"
        networks:
            - app_network
        restart: unless-stopped

    redis:
        image: redis:alpine
        dns:
            - 8.8.8.8
            - 8.8.4.4
        container_name: redis
        ports:
            - "6380:6379"
        networks:
            - app_network
        restart: unless-stopped

    worker:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
        container_name: worker
        dns:
            - 8.8.8.8
            - 8.8.4.4
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - app_network
        depends_on:
            - redis
            - db
        environment:
            - QUEUE_CONNECTION=redis
        command: >
            sh -c "
            php artisan queue:work --tries=3 --timeout=90
            "
        restart: unless-stopped

    websocket:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
        dns:
            - 8.8.8.8
            - 8.8.4.4
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - app_network
        depends_on:
            - redis
            - rabbitmq
            - db
        ports:
            - "8080:8080"
        command: >
            sh -c "
            php artisan reverb:start
            "
        restart: unless-stopped

    friend_feed_worker:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
        dns:
            - 8.8.8.8
            - 8.8.4.4
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - app_network
        environment:
            - QUEUE_CONNECTION=sync
        depends_on:
            - db
            - rabbitmq
            - redis
        command: >
            sh -c "
            php artisan rabbitmq:friend-feed-work
            "
        restart: unless-stopped

    friend_feed_worker_for_celebrity:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
        dns:
            - 8.8.8.8
            - 8.8.4.4
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - app_network
        environment:
            - QUEUE_CONNECTION=sync
        depends_on:
            - db
            - rabbitmq
            - redis
        command: >
            sh -c "
            php artisan rabbitmq:friend-feed-for-celebrity-work
            "
        restart: unless-stopped

    notification_worker:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
        dns:
            - 8.8.8.8
            - 8.8.4.4
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - app_network
        environment:
            - QUEUE_CONNECTION=sync
        depends_on:
            - db
            - rabbitmq
            - redis
        command: >
            sh -c "
            php artisan rabbitmq:notification-work
            "
        restart: unless-stopped

    rabbitmq:
        image: rabbitmq:3-management-alpine
        dns:
            - 8.8.8.8
            - 8.8.4.4
        container_name: rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - app_network
        healthcheck:
            test: [ "CMD-SHELL", "rabbitmq-diagnostics -q ping" ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

networks:
    app_network:
        driver: bridge

volumes:
    dbdata:
        driver: local
